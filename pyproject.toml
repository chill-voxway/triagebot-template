[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# Los alumnos no pueden tocar los tests de aceptación: que sus líneas largas no tumben la CI.
"tests/test_acceptance.py" = ["E501"]
